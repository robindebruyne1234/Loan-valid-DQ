[project]
name = "berka-control"
version = "0.1.0"
description = "The governed surface: control dataset, layer contracts and the agent runtime"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
berka_control = ["*.yaml"]
