<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 868" width="1340" height="868" role="img" aria-label="Every defect type found, grouped by severity, with the rows affected on a logarithmic scale, the questions each one touches, and what would permanently solve it. The one block-severity defect affects a single row and two answers; the info band holds over two and a half million rows and changes no reported number.">
<rect width="1340" height="868" fill="#ffffff"/>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text x="20" y="32" font-size="17" font-weight="600" fill="#1f3864">Every defect found: 14 types, and what would solve each one</text>
<text x="20" y="52" font-size="11.5" fill="#5b6472">Bars are logarithmic. Read the shape, not the length: the band that removes data holds one row, and the band holding 2.5 million rows removes nothing and changes no answer.</text>
<text x="20" y="68" font-size="11.5" fill="#5b6472">Volume is not harm. Grading each defect by what it would cost to act on it is the whole job -- the rule that finds it is the easy half.</text>
<text x="20" y="104" font-size="10.5" fill="#5b6472">defect type</text>
<text x="352" y="104" font-size="10.5" fill="#5b6472">rows affected (log scale)</text>
<text x="668" y="104" font-size="10.5" fill="#5b6472">answers</text>
<text x="760" y="104" font-size="10.5" fill="#5b6472">what would permanently solve it</text>
<line x1="16" y1="112" x2="1324" y2="112" stroke="#e3e7ed" stroke-width="1"/>
<rect x="16" y="124" width="1308" height="80" rx="6" fill="#fdf4f4"/>
<rect x="16" y="124" width="5" height="80" rx="2" fill="#991b1b"/>
<rect x="32" y="133" width="58" height="18" rx="9" fill="#991b1b"/>
<text x="61" y="146" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">BLOCK</text>
<text x="102" y="146" font-size="11.5" fill="#1f2a44">1 type(s), 1 rows -- removed from the product, and the removal is counted</text>
<text x="32" y="178" font-size="11.5" fill="#1f2a44">Duplicate transaction by business key (distinct i...</text>
<text x="32" y="191" font-size="9.5" fill="#8a93a0">uniqueness</text>
<rect x="352" y="169" width="4.0" height="13" rx="2" fill="#991b1b" opacity="0.75"/>
<text x="590" y="180" font-size="10.5" fill="#1f2a44">1</text>
<text x="668" y="180" font-size="10.5" fill="#1f3864">Q5, Q9</text>
<text x="760" y="177" font-size="10.5" fill="#5b6472">Delete the twin in the source system. Quarantine names both ids, the account</text>
<text x="760" y="190" font-size="10.5" fill="#5b6472">and the date.</text>
<rect x="16" y="216" width="1308" height="182" rx="6" fill="#fffaf0"/>
<rect x="16" y="216" width="5" height="182" rx="2" fill="#b45309"/>
<rect x="32" y="225" width="58" height="18" rx="9" fill="#b45309"/>
<text x="61" y="238" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">WARN</text>
<text x="102" y="238" font-size="11.5" fill="#1f2a44">4 type(s), 440 rows -- kept, flagged, and the caveat reaches the answer</text>
<text x="32" y="270" font-size="11.5" fill="#1f2a44">Closing balance of the account's last day is not ...</text>
<text x="32" y="283" font-size="9.5" fill="#8a93a0">consistency</text>
<rect x="352" y="261" width="85.5" height="13" rx="2" fill="#b45309" opacity="0.75"/>
<text x="590" y="272" font-size="10.5" fill="#1f2a44">183</text>
<text x="668" y="272" font-size="10.5" fill="#1f3864">Q9</text>
<text x="760" y="269" font-size="10.5" fill="#5b6472">Have the source record posting order within a day (a sequence or a timestamp).</text>
<text x="32" y="304" font-size="11.5" fill="#1f2a44">Running balance does not reconcile</text>
<text x="32" y="317" font-size="9.5" fill="#8a93a0">consistency</text>
<rect x="352" y="295" width="80.7" height="13" rx="2" fill="#b45309" opacity="0.75"/>
<text x="590" y="306" font-size="10.5" fill="#1f2a44">136</text>
<text x="668" y="306" font-size="10.5" fill="#1f3864">Q9</text>
<text x="760" y="303" font-size="10.5" fill="#5b6472">Find the missing or extra posting. 55 accounts are material, not rounding; one</text>
<text x="760" y="316" font-size="10.5" fill="#5b6472">is out by 1,200.</text>
<text x="32" y="338" font-size="11.5" fill="#1f2a44">Implausible age</text>
<text x="32" y="351" font-size="9.5" fill="#8a93a0">validity</text>
<rect x="352" y="329" width="78.6" height="13" rx="2" fill="#b45309" opacity="0.75"/>
<text x="590" y="340" font-size="10.5" fill="#1f2a44">120</text>
<text x="668" y="340" font-size="10.5" fill="#1f3864">Q7, Q8</text>
<text x="760" y="337" font-size="10.5" fill="#5b6472">Correct the birth number, or the owner flag, in the customer system.</text>
<text x="32" y="372" font-size="11.5" fill="#1f2a44">Counterparty missing on a transfer posting</text>
<text x="32" y="385" font-size="9.5" fill="#8a93a0">completeness</text>
<rect x="352" y="363" width="4.0" height="13" rx="2" fill="#b45309" opacity="0.75"/>
<text x="590" y="374" font-size="10.5" fill="#1f2a44">1</text>
<text x="668" y="374" font-size="10.5" fill="#aab2bd">-</text>
<text x="760" y="371" font-size="10.5" fill="#5b6472">A transfer has two sides. Fix the feed that dropped one.</text>
<rect x="16" y="410" width="1308" height="352" rx="6" fill="#f4faf6"/>
<rect x="16" y="410" width="5" height="352" rx="2" fill="#15803d"/>
<rect x="32" y="419" width="58" height="18" rx="9" fill="#15803d"/>
<text x="61" y="432" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">INFO</text>
<text x="102" y="432" font-size="11.5" fill="#1f2a44">9 type(s), 2,556,535 rows -- standardised and logged; no reported number moves</text>
<text x="32" y="464" font-size="11.5" fill="#1f2a44">Missing values in columns no certified metric reads</text>
<text x="32" y="477" font-size="9.5" fill="#8a93a0">completeness</text>
<rect x="352" y="455" width="228.0" height="13" rx="2" fill="#15803d" opacity="0.75"/>
<text x="590" y="466" font-size="10.5" fill="#1f2a44">1,073,727</text>
<text x="668" y="466" font-size="10.5" fill="#aab2bd">-</text>
<text x="760" y="463" font-size="10.5" fill="#5b6472">Nothing today. The rule stays so the grade can be promoted the day a metric</text>
<text x="760" y="476" font-size="10.5" fill="#5b6472">reads the column.</text>
<text x="32" y="498" font-size="11.5" fill="#1f2a44">Counterparty bank and account absent for non-tran...</text>
<text x="32" y="511" font-size="9.5" fill="#8a93a0">completeness</text>
<rect x="352" y="489" width="222.3" height="13" rx="2" fill="#15803d" opacity="0.75"/>
<text x="590" y="500" font-size="10.5" fill="#1f2a44">760,931</text>
<text x="668" y="500" font-size="10.5" fill="#aab2bd">-</text>
<text x="760" y="497" font-size="10.5" fill="#5b6472">Nothing. Cash operations have no counterparty; this is structural and</text>
<text x="760" y="510" font-size="10.5" fill="#5b6472">documented.</text>
<text x="32" y="532" font-size="11.5" fill="#1f2a44">The same column encodes 'missing' three different...</text>
<text x="32" y="545" font-size="9.5" fill="#8a93a0">completeness</text>
<rect x="352" y="523" width="216.6" height="13" rx="2" fill="#15803d" opacity="0.75"/>
<text x="590" y="534" font-size="10.5" fill="#1f2a44">535,314</text>
<text x="668" y="534" font-size="10.5" fill="#aab2bd">-</text>
<text x="760" y="531" font-size="10.5" fill="#5b6472">Collapsed to one NULL in staging. Ask the source to settle on a single</text>
<text x="760" y="544" font-size="10.5" fill="#5b6472">spelling.</text>
<text x="32" y="566" font-size="11.5" fill="#1f2a44">Transaction operation absent (structurally, for i...</text>
<text x="32" y="579" font-size="9.5" fill="#8a93a0">completeness</text>
<rect x="352" y="557" width="199.0" height="13" rx="2" fill="#15803d" opacity="0.75"/>
<text x="590" y="568" font-size="10.5" fill="#1f2a44">183,114</text>
<text x="668" y="568" font-size="10.5" fill="#aab2bd">-</text>
<text x="760" y="565" font-size="10.5" fill="#5b6472">Nothing. These are the bank's own interest runs, which have no customer</text>
<text x="760" y="578" font-size="10.5" fill="#5b6472">operation.</text>
<text x="32" y="600" font-size="11.5" fill="#1f2a44">Balance after the transaction is negative (overdr...</text>
<text x="32" y="613" font-size="9.5" fill="#8a93a0">validity</text>
<rect x="352" y="591" width="131.4" height="13" rx="2" fill="#15803d" opacity="0.75"/>
<text x="590" y="602" font-size="10.5" fill="#1f2a44">2,999</text>
<text x="668" y="602" font-size="10.5" fill="#1f3864">Q9</text>
<text x="760" y="599" font-size="10.5" fill="#5b6472">Nothing. Overdraft is real banking. Clipping it at zero would bias the Q9</text>
<text x="760" y="612" font-size="10.5" fill="#5b6472">average upwards.</text>
<text x="32" y="634" font-size="11.5" fill="#1f2a44">Owner's own district differs from the district of...</text>
<text x="32" y="647" font-size="9.5" fill="#8a93a0">consistency</text>
<rect x="352" y="625" width="98.7" height="13" rx="2" fill="#15803d" opacity="0.75"/>
<text x="590" y="636" font-size="10.5" fill="#1f2a44">409</text>
<text x="668" y="636" font-size="10.5" fill="#1f3864">Q1, Q5</text>
<text x="760" y="633" font-size="10.5" fill="#5b6472">Nothing. People move. Both readings are published and each question states</text>
<text x="760" y="646" font-size="10.5" fill="#5b6472">which it uses.</text>
<text x="32" y="668" font-size="11.5" fill="#1f2a44">Two clients share birth number and district (poss...</text>
<text x="32" y="681" font-size="9.5" fill="#8a93a0">uniqueness</text>
<rect x="352" y="659" width="53.5" height="13" rx="2" fill="#15803d" opacity="0.75"/>
<text x="590" y="670" font-size="10.5" fill="#1f2a44">26</text>
<text x="668" y="670" font-size="10.5" fill="#1f3864">Q1, Q8</text>
<text x="760" y="667" font-size="10.5" fill="#5b6472">Candidate duplicate people. A master-data process should review the 26 pairs.</text>
<text x="32" y="702" font-size="11.5" fill="#1f2a44">Transaction amount is zero or negative</text>
<text x="32" y="715" font-size="9.5" fill="#8a93a0">validity</text>
<rect x="352" y="693" width="43.3" height="13" rx="2" fill="#15803d" opacity="0.75"/>
<text x="590" y="704" font-size="10.5" fill="#1f2a44">14</text>
<text x="668" y="704" font-size="10.5" fill="#aab2bd">-</text>
<text x="760" y="701" font-size="10.5" fill="#5b6472">Nothing. Interest that accrued nothing. Blocking would break 14 balance chains</text>
<text x="760" y="714" font-size="10.5" fill="#5b6472">to fix nothing.</text>
<text x="32" y="736" font-size="11.5" fill="#1f2a44">Placeholder '?' in the 1995 unemployment and crim...</text>
<text x="32" y="749" font-size="9.5" fill="#8a93a0">completeness</text>
<rect x="352" y="727" width="4.0" height="13" rx="2" fill="#15803d" opacity="0.75"/>
<text x="590" y="738" font-size="10.5" fill="#1f2a44">1</text>
<text x="668" y="738" font-size="10.5" fill="#aab2bd">-</text>
<text x="760" y="735" font-size="10.5" fill="#5b6472">Ask the source for the two missing figures. Promote to warn if a metric ever</text>
<text x="760" y="748" font-size="10.5" fill="#5b6472">reads the 1995 series.</text>
<text x="20" y="798" font-size="11.5" fill="#1f2a44">Nine of the fourteen need no fix at all. They are reported so that nobody "cleans" them later and breaks something: clipping overdrafts would bias the Q9 average,</text>
<text x="20" y="814" font-size="11.5" fill="#1f2a44">and blocking the 14 zero-value postings would break 14 balance chains to fix nothing. Writing down why not to act is as much of the job as acting.</text>
</g>
</svg>