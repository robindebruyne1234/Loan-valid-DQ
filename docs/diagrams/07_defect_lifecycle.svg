<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 660" width="1220" height="660"
     role="img" aria-label="The life of a defect. Every defect follows the same path: it arrives in a source file, survives the cast into staging, is found by one of 123 rules, and is graded block, warn or info. Each grade has a different immediate treatment, a different place the reader can see it, and a different route to a permanent fix. A block row is quarantined and solved by correcting the source and reloading. A warn row is kept and flagged and is solved either by correcting the source or by accepting it as reality and keeping the caveat. An info row is standardised and is solved by promoting the rule the day a metric starts reading that column.">
  <defs>
    <marker id="a7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472"/>
    </marker>
  </defs>
  <rect width="1220" height="660" fill="#ffffff"/>

  <text x="20" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f3864">The life of a defect</text>
  <text x="20" y="48" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6472">Nothing is ever deleted quietly. Every defect takes one of three paths, and each path ends somewhere a reader can see it.</text>

  <!-- ===== shared path ===== -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="20" y="68" width="150" height="46" rx="5" fill="#ffffff" stroke="#5b6472" stroke-width="1.2"/>
    <text x="95" y="87" font-size="11.5" fill="#1f2a44" text-anchor="middle">1. arrives in a file</text>
    <text x="95" y="102" font-size="10" fill="#5b6472" text-anchor="middle">copied byte for byte</text>

    <line x1="170" y1="91" x2="202" y2="91" stroke="#5b6472" stroke-width="1.3" marker-end="url(#a7)"/>
    <rect x="207" y="68" width="150" height="46" rx="5" fill="#ffffff" stroke="#5b6472" stroke-width="1.2"/>
    <text x="282" y="87" font-size="11.5" fill="#1f2a44" text-anchor="middle">2. survives the cast</text>
    <text x="282" y="102" font-size="10" fill="#5b6472" text-anchor="middle">original kept in *_raw</text>

    <line x1="357" y1="91" x2="389" y2="91" stroke="#5b6472" stroke-width="1.3" marker-end="url(#a7)"/>
    <rect x="394" y="68" width="160" height="46" rx="5" fill="#fff4e5" stroke="#b45309" stroke-width="1.4"/>
    <text x="474" y="87" font-size="11.5" fill="#1f2a44" text-anchor="middle">3. a rule finds it</text>
    <text x="474" y="102" font-size="10" fill="#5b6472" text-anchor="middle">123 rules, 6 dimensions</text>

    <line x1="554" y1="91" x2="586" y2="91" stroke="#5b6472" stroke-width="1.3" marker-end="url(#a7)"/>
    <rect x="591" y="68" width="190" height="46" rx="5" fill="#eef3fb" stroke="#1f3864" stroke-width="1.4"/>
    <text x="686" y="87" font-size="11.5" fill="#1f2a44" text-anchor="middle">4. it is graded</text>
    <text x="686" y="102" font-size="10" fill="#5b6472" text-anchor="middle">with the reason written down</text>

    <text x="800" y="84" font-size="10.5" fill="#5b6472">The grade is the hard part, not the rule:</text>
    <text x="800" y="99" font-size="10.5" fill="#5b6472">it decides what blocking would COST.</text>
    <text x="800" y="114" font-size="10.5" fill="#991b1b">A wrong grade does more damage than the defect.</text>

    <line x1="686" y1="114" x2="686" y2="140" stroke="#5b6472" stroke-width="1.3"/>
    <line x1="140" y1="140" x2="1180" y2="140" stroke="#5b6472" stroke-width="1.3"/>
    <line x1="140" y1="140" x2="140" y2="178" stroke="#5b6472" stroke-width="1.3" marker-end="url(#a7)"/>
    <line x1="600" y1="140" x2="600" y2="178" stroke="#5b6472" stroke-width="1.3" marker-end="url(#a7)"/>
    <line x1="1060" y1="140" x2="1060" y2="178" stroke="#5b6472" stroke-width="1.3" marker-end="url(#a7)"/>
  </g>

  <!-- ===== column captions ===== -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6472">
    <text x="20" y="196">the grade</text>
    <text x="222" y="196">what happens immediately</text>
    <text x="512" y="196">where the reader sees it</text>
    <text x="782" y="196">how it is permanently solved</text>
  </g>
  <line x1="16" y1="204" x2="1204" y2="204" stroke="#e3e7ed" stroke-width="1"/>

  <!-- ===== BLOCK ===== -->
  <rect x="16" y="212" width="1188" height="128" rx="6" fill="#fdf4f4"/>
  <rect x="16" y="212" width="5" height="128" rx="2" fill="#991b1b"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="32" y="228" width="58" height="19" rx="9" fill="#991b1b"/>
    <text x="61" y="241" font-size="10.5" font-weight="600" fill="#ffffff" text-anchor="middle">BLOCK</text>
    <text x="32" y="266" font-size="11.5" fill="#1f2a44">breaks a key, a join</text>
    <text x="32" y="281" font-size="11.5" fill="#1f2a44">path or a certified</text>
    <text x="32" y="296" font-size="11.5" fill="#1f2a44">number</text>
    <text x="32" y="318" font-size="10.5" fill="#991b1b" font-weight="600">1 row on this data</text>

    <text x="222" y="236" font-size="11.5" fill="#1f2a44">The row is moved to a quarantine</text>
    <text x="222" y="252" font-size="11.5" fill="#1f2a44">table, with the rule that rejected</text>
    <text x="222" y="268" font-size="11.5" fill="#1f2a44">it, the reason, and a snapshot of</text>
    <text x="222" y="284" font-size="11.5" fill="#1f2a44">the row as it arrived.</text>
    <text x="222" y="306" font-size="11" fill="#5b6472">It never reaches the shelves an</text>
    <text x="222" y="321" font-size="11" fill="#5b6472">AI consumer can read.</text>

    <text x="512" y="236" font-size="11.5" fill="#1f2a44">The row count drops by exactly</text>
    <text x="512" y="252" font-size="11.5" fill="#1f2a44">one, and the build proves it:</text>
    <text x="512" y="270" font-size="11" font-family="Consolas, monospace" fill="#1f3864">core = staging - quarantine</text>
    <text x="512" y="292" font-size="11" fill="#5b6472">1,056,320 in the file,</text>
    <text x="512" y="307" font-size="11" fill="#5b6472">1,056,319 in the product,</text>
    <text x="512" y="322" font-size="11" fill="#5b6472">and a named rule for the gap.</text>

    <text x="782" y="236" font-size="11.5" fill="#1f2a44">Fix it at the source and reload.</text>
    <text x="782" y="256" font-size="11" fill="#5b6472">The quarantine row names the account,</text>
    <text x="782" y="271" font-size="11" fill="#5b6472">the date and the twin posting, so an</text>
    <text x="782" y="286" font-size="11" fill="#5b6472">operations team can find it in the</text>
    <text x="782" y="301" font-size="11" fill="#5b6472">originating system. Nothing was</text>
    <text x="782" y="316" font-size="11" fill="#5b6472">destroyed, so the fix is a reload, not</text>
    <text x="782" y="331" font-size="11" fill="#5b6472">a recovery.</text>
  </g>

  <!-- ===== WARN ===== -->
  <rect x="16" y="348" width="1188" height="128" rx="6" fill="#fffaf0"/>
  <rect x="16" y="348" width="5" height="128" rx="2" fill="#b45309"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="32" y="364" width="52" height="19" rx="9" fill="#b45309"/>
    <text x="58" y="377" font-size="10.5" font-weight="600" fill="#ffffff" text-anchor="middle">WARN</text>
    <text x="32" y="402" font-size="11.5" fill="#1f2a44">usable, but a number</text>
    <text x="32" y="417" font-size="11.5" fill="#1f2a44">built on it should say</text>
    <text x="32" y="432" font-size="11.5" fill="#1f2a44">so</text>
    <text x="32" y="454" font-size="10.5" fill="#b45309" font-weight="600">440 rows on this data</text>

    <text x="222" y="372" font-size="11.5" fill="#1f2a44">The row stays. A flag is attached</text>
    <text x="222" y="388" font-size="11.5" fill="#1f2a44">to it naming the rule.</text>
    <text x="222" y="410" font-size="11" fill="#5b6472">The flag travels with the row into</text>
    <text x="222" y="425" font-size="11" fill="#5b6472">the model, out through the views,</text>
    <text x="222" y="440" font-size="11" fill="#5b6472">and into the semantic layer as a</text>
    <text x="222" y="455" font-size="11" fill="#5b6472">caveat the AI repeats in its answer.</text>

    <text x="512" y="372" font-size="11.5" fill="#1f2a44">Next to the number, not in a</text>
    <text x="512" y="388" font-size="11.5" fill="#1f2a44">footnote. Q9 reports its average</text>
    <text x="512" y="404" font-size="11.5" fill="#1f2a44">and, beside it, that 55 accounts</text>
    <text x="512" y="420" font-size="11.5" fill="#1f2a44">do not reconcile and 76 balances</text>
    <text x="512" y="436" font-size="11.5" fill="#1f2a44">were carried forward.</text>
    <text x="512" y="458" font-size="11" fill="#5b6472">Q7 reports the age with AND</text>
    <text x="512" y="473" font-size="11" fill="#5b6472">without its 6 flagged loans.</text>

    <text x="782" y="372" font-size="11.5" fill="#1f2a44">One of two routes, and you must choose:</text>
    <text x="782" y="392" font-size="11" fill="#5b6472">(a) It really is wrong -- a 10-year-old</text>
    <text x="782" y="407" font-size="11" fill="#5b6472">cannot own an account. Correct it at</text>
    <text x="782" y="422" font-size="11" fill="#5b6472">source; the flag disappears by itself.</text>
    <text x="782" y="442" font-size="11" fill="#5b6472">(b) It is reality -- intra-day order simply</text>
    <text x="782" y="457" font-size="11" fill="#5b6472">is not recorded. Then the caveat is the</text>
    <text x="782" y="472" font-size="11" fill="#5b6472">permanent answer, and that is honest.</text>
  </g>

  <!-- ===== INFO ===== -->
  <rect x="16" y="484" width="1188" height="162" rx="6" fill="#f4faf6"/>
  <rect x="16" y="484" width="5" height="162" rx="2" fill="#15803d"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="32" y="500" width="46" height="19" rx="9" fill="#15803d"/>
    <text x="55" y="513" font-size="10.5" font-weight="600" fill="#ffffff" text-anchor="middle">INFO</text>
    <text x="32" y="538" font-size="11.5" fill="#1f2a44">untidy, or no</text>
    <text x="32" y="553" font-size="11.5" fill="#1f2a44">certified number</text>
    <text x="32" y="568" font-size="11.5" fill="#1f2a44">reads it</text>
    <text x="32" y="590" font-size="10.5" fill="#15803d" font-weight="600">2.55 m rows</text>
    <text x="32" y="605" font-size="10.5" fill="#15803d" font-weight="600">on this data</text>

    <text x="222" y="508" font-size="11.5" fill="#1f2a44">The value is standardised -- three</text>
    <text x="222" y="524" font-size="11.5" fill="#1f2a44">spellings of "missing" become one --</text>
    <text x="222" y="540" font-size="11.5" fill="#1f2a44">and the original text is kept.</text>
    <text x="222" y="562" font-size="11" fill="#5b6472">Nothing is removed and no reported</text>
    <text x="222" y="577" font-size="11" fill="#5b6472">number moves. The count is recorded</text>
    <text x="222" y="592" font-size="11" fill="#5b6472">so the next person starts from a</text>
    <text x="222" y="607" font-size="11" fill="#5b6472">known baseline rather than a guess.</text>

    <text x="512" y="508" font-size="11.5" fill="#1f2a44">In the data quality report, with</text>
    <text x="512" y="524" font-size="11.5" fill="#1f2a44">its count and its meaning.</text>
    <text x="512" y="546" font-size="11" fill="#5b6472">This is the band that holds the</text>
    <text x="512" y="561" font-size="11" fill="#5b6472">huge numbers -- and changes no</text>
    <text x="512" y="576" font-size="11" fill="#5b6472">answer at all. 183,114 postings</text>
    <text x="512" y="591" font-size="11" fill="#5b6472">have no operation because they</text>
    <text x="512" y="606" font-size="11" fill="#5b6472">are the bank's own interest run.</text>
    <text x="512" y="621" font-size="11" fill="#5b6472">That is a fact, not a gap.</text>

    <text x="782" y="508" font-size="11.5" fill="#1f2a44">Usually nothing -- and that is the point.</text>
    <text x="782" y="528" font-size="11" fill="#5b6472">The rule stays in place so that the day a</text>
    <text x="782" y="543" font-size="11" fill="#5b6472">metric starts reading that column, the</text>
    <text x="782" y="558" font-size="11" fill="#5b6472">grade is promoted to warn or block with a</text>
    <text x="782" y="573" font-size="11" fill="#5b6472">one-line change, instead of the gap being</text>
    <text x="782" y="588" font-size="11" fill="#5b6472">discovered by a wrong report.</text>
    <text x="782" y="610" font-size="11" fill="#15803d">Worked example: the '?' in the 1995 columns</text>
    <text x="782" y="625" font-size="11" fill="#15803d">is info today, and warn the moment anyone</text>
    <text x="782" y="640" font-size="11" fill="#15803d">averages across districts.</text>
  </g>
</svg>
