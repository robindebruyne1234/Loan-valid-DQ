<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="860" viewBox="0 0 1340 860" font-family="Calibri, Carlito, DejaVu Sans, sans-serif">
  <rect width="1340" height="860" fill="#ffffff"/>
  <text x="20" y="34" font-size="22" font-weight="bold" fill="#1f3864">Two steps to a login, and what each one actually stops</text>
  <text x="20" y="56" font-size="13" fill="#5b6472">The point of the second factor is the middle column: a correct password, on its own, returns an empty database. Verified by test, for every principal.</text>

  <!-- lanes -->
  <rect x="20" y="78" width="300" height="34" rx="4" fill="#1f3864"/>
  <text x="34" y="101" font-size="13" font-weight="bold" fill="#ffffff">THE PERSON</text>
  <rect x="330" y="78" width="430" height="34" rx="4" fill="#1f3864"/>
  <text x="344" y="101" font-size="13" font-weight="bold" fill="#ffffff">POSTGRESQL  (checks it, as itself)</text>
  <rect x="770" y="78" width="550" height="34" rx="4" fill="#1f3864"/>
  <text x="784" y="101" font-size="13" font-weight="bold" fill="#ffffff">WHAT THEY CAN READ AT THIS MOMENT</text>

  <!-- step 0 -->
  <rect x="20" y="124" width="1300" height="78" rx="5" fill="#f7f9fc" stroke="#5b6472"/>
  <circle cx="48" cy="163" r="15" fill="#5b6472"/><text x="48" y="168" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">0</text>
  <text x="76" y="150" font-size="13" font-weight="bold" fill="#1f2a44">Not connected</text>
  <text x="76" y="169" font-size="11.5" fill="#5b6472">The customer opens the app.</text>
  <text x="344" y="150" font-size="12" fill="#5b6472">Nothing yet.</text>
  <text x="784" y="158" font-size="13" font-weight="bold" fill="#991b1b">Nothing.</text>
  <text x="784" y="177" font-size="11.5" fill="#5b6472">No connection, no identity, no rows.</text>

  <!-- step 1 -->
  <rect x="20" y="212" width="1300" height="112" rx="5" fill="#f7f9fc" stroke="#2c4c80" stroke-width="1.5"/>
  <circle cx="48" cy="268" r="15" fill="#2c4c80"/><text x="48" y="273" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="76" y="238" font-size="13" font-weight="bold" fill="#2c4c80">FACTOR 1 — something they know</text>
  <text x="76" y="258" font-size="11.5" fill="#5b6472">They type their password.</text>
  <text x="76" y="276" font-size="11.5" fill="#5b6472">The connection opens as their</text>
  <text x="76" y="291" font-size="11.5" fill="#5b6472">own database role.</text>
  <text x="344" y="238" font-size="12" font-weight="bold" fill="#1f2a44">PostgreSQL checks the password itself.</text>
  <text x="344" y="257" font-size="11.5" fill="#5b6472">session_user is now set, and NO statement</text>
  <text x="344" y="272" font-size="11.5" fill="#5b6472">the caller — or a language model — can emit</text>
  <text x="344" y="287" font-size="11.5" fill="#5b6472">will ever change it. That is what makes it a</text>
  <text x="344" y="302" font-size="11.5" fill="#5b6472">usable identity rather than a claim.</text>
  <rect x="770" y="226" width="540" height="84" rx="4" fill="#fdf4f4" stroke="#991b1b" stroke-width="1.5"/>
  <text x="784" y="248" font-size="15" font-weight="bold" fill="#991b1b">STILL NOTHING — 0 clients, 0 accounts, 0 rows</text>
  <text x="784" y="269" font-size="11.5" fill="#5b6472">The grant resolution requires a verified session, and there</text>
  <text x="784" y="284" font-size="11.5" fill="#5b6472">is none. The queries RUN; they return empty.</text>
  <text x="784" y="302" font-size="11.5" font-weight="bold" fill="#991b1b">A stolen password is not a breach. It is an empty database.</text>

  <!-- step 2 -->
  <rect x="20" y="334" width="1300" height="130" rx="5" fill="#f7f9fc" stroke="#15803d" stroke-width="1.5"/>
  <circle cx="48" cy="399" r="15" fill="#15803d"/><text x="48" y="404" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="76" y="360" font-size="13" font-weight="bold" fill="#15803d">FACTOR 2 — something they have</text>
  <text x="76" y="380" font-size="11.5" fill="#5b6472">Their authenticator app shows a</text>
  <text x="76" y="395" font-size="11.5" fill="#5b6472">six-digit code, good for 30s.</text>
  <text x="76" y="414" font-size="11.5" fill="#5b6472">They type it.</text>
  <text x="76" y="437" font-size="11" font-style="italic" fill="#991b1b">In the demo the console prints</text>
  <text x="76" y="450" font-size="11" font-style="italic" fill="#991b1b">it — an audience has no phones.</text>
  <text x="344" y="360" font-size="12" font-weight="bold" fill="#1f2a44">sec.verify_second_factor(code)</text>
  <text x="344" y="379" font-size="11.5" fill="#5b6472">Real RFC 6238 TOTP, computed in the database</text>
  <text x="344" y="394" font-size="11.5" fill="#5b6472">so the shared secret never crosses the wire.</text>
  <text x="344" y="409" font-size="11.5" fill="#5b6472">Checked against the RFC's own test vectors.</text>
  <text x="344" y="428" font-size="11.5" fill="#5b6472">It takes a CODE, never a principal: whose factor</text>
  <text x="344" y="443" font-size="11.5" fill="#5b6472">is checked comes from session_user alone.</text>
  <rect x="770" y="348" width="540" height="102" rx="4" fill="#f4faf6" stroke="#15803d" stroke-width="1.5"/>
  <text x="784" y="370" font-size="15" font-weight="bold" fill="#15803d">EXACTLY WHAT THEY ARE ENTITLED TO — and no more</text>
  <text x="784" y="391" font-size="11.5" fill="#5b6472">A session opens, bound to this role AND this backend process,</text>
  <text x="784" y="406" font-size="11.5" fill="#5b6472">for 30 minutes. The grants resolve. The policies narrow every</text>
  <text x="784" y="421" font-size="11.5" fill="#5b6472">query on this connection, whoever wrote the SQL.</text>
  <text x="784" y="441" font-size="11.5" font-weight="bold" fill="#1f2a44">Customer: 1 client. Manager: their book. Nobody: everything.</text>

  <!-- what the second factor stops -->
  <rect x="20" y="482" width="1300" height="192" rx="6" fill="#ffffff" stroke="#1f3864" stroke-width="1.5"/>
  <rect x="20" y="482" width="1300" height="30" rx="6" fill="#1f3864"/>
  <text x="34" y="502" font-size="13" font-weight="bold" fill="#ffffff">FOUR ATTACKS, AND WHICH PART STOPS EACH ONE</text>

  <rect x="34" y="524" width="314" height="134" rx="4" fill="#f7f9fc" stroke="#991b1b"/>
  <text x="48" y="545" font-size="12.5" font-weight="bold" fill="#991b1b">The password leaks</text>
  <text x="48" y="564" font-size="11.5" fill="#5b6472">Phishing, a reused password,</text>
  <text x="48" y="579" font-size="11.5" fill="#5b6472">a database dump.</text>
  <text x="48" y="602" font-size="11.5" font-weight="bold" fill="#15803d">Stopped by factor 2.</text>
  <text x="48" y="620" font-size="11" fill="#5b6472">They connect and read nothing.</text>
  <text x="48" y="635" font-size="11" fill="#5b6472">Tested for all 8 principals.</text>

  <rect x="362" y="524" width="314" height="134" rx="4" fill="#f7f9fc" stroke="#991b1b"/>
  <text x="376" y="545" font-size="12.5" font-weight="bold" fill="#991b1b">A code is observed</text>
  <text x="376" y="564" font-size="11.5" fill="#5b6472">Shoulder-surfed, or read from</text>
  <text x="376" y="579" font-size="11.5" fill="#5b6472">a screen share, inside its 30s.</text>
  <text x="376" y="602" font-size="11.5" font-weight="bold" fill="#15803d">Stopped by single use.</text>
  <text x="376" y="620" font-size="11" fill="#5b6472">last_step marks it spent; the</text>
  <text x="376" y="635" font-size="11" fill="#5b6472">second attempt is refused.</text>

  <rect x="690" y="524" width="314" height="134" rx="4" fill="#f7f9fc" stroke="#991b1b"/>
  <text x="704" y="545" font-size="12.5" font-weight="bold" fill="#991b1b">A session id is stolen</text>
  <text x="704" y="564" font-size="11.5" fill="#5b6472">The bearer token is copied to</text>
  <text x="704" y="579" font-size="11.5" fill="#5b6472">another connection.</text>
  <text x="704" y="602" font-size="11.5" font-weight="bold" fill="#15803d">Stopped by the pid binding.</text>
  <text x="704" y="620" font-size="11" fill="#5b6472">A session is valid only on the</text>
  <text x="704" y="635" font-size="11" fill="#5b6472">backend that created it.</text>

  <rect x="1018" y="524" width="288" height="134" rx="4" fill="#f7f9fc" stroke="#991b1b"/>
  <text x="1032" y="545" font-size="12.5" font-weight="bold" fill="#991b1b">The code is guessed</text>
  <text x="1032" y="564" font-size="11.5" fill="#5b6472">A million tries at six digits.</text>
  <text x="1032" y="602" font-size="11.5" font-weight="bold" fill="#15803d">Stopped by lockout.</text>
  <text x="1032" y="620" font-size="11" fill="#5b6472">Five failures locks the factor</text>
  <text x="1032" y="635" font-size="11" fill="#5b6472">for fifteen minutes.</text>

  <!-- honest limits -->
  <rect x="20" y="690" width="1300" height="106" rx="6" fill="#fffaf0" stroke="#b45309" stroke-width="1.5"/>
  <text x="34" y="712" font-size="13" font-weight="bold" fill="#b45309">WHAT THIS IS NOT — stated here rather than left to be found</text>
  <text x="34" y="733" font-size="11.5" fill="#5b6472">The TOTP secrets are stored recoverable, because verifying a code requires them. That column is the most sensitive in the schema; a real deployment encrypts it with a key held outside the database.</text>
  <text x="34" y="751" font-size="11.5" fill="#5b6472">The demo console prints the one-time code. A system that can show you your own second factor has one factor. It exists so a walkthrough needs no phones, and it is the first thing a deployment removes.</text>
  <text x="34" y="769" font-size="11.5" fill="#5b6472">There is no record of who actually read a row — only of who could. That is a regulatory gap for a bank, not a simplification, and it is the largest missing control in this build.</text>
  <text x="34" y="787" font-size="11.5" fill="#5b6472">Role-per-user does not pool connections. Correct at this size; the first real engineering problem the moment a customer portal with concurrent users is put in front of it.</text>
</svg>
