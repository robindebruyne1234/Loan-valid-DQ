<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 782" width="1240" height="782" role="img" aria-label="The thirteen steps that one command runs, in order, with what each produces and which gates can stop the build. Six of the thirteen can halt the pipeline, so a broken build never reaches a deliverable.">
<rect width="1240" height="782" fill="#ffffff"/>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text x="20" y="32" font-size="17" font-weight="600" fill="#1f3864">What `make all` actually does: 13 steps, 4m28s, from an empty database</text>
<text x="20" y="53" font-size="11.5" fill="#5b6472">Six of the thirteen can halt the build (marked in red). That is the point: a broken pipeline never reaches a deliverable, so a wrong number cannot be quietly shipped.</text>
<text x="20" y="70" font-size="11.5" fill="#5b6472">Measured from `make clean all` against an empty database, not estimated.</text>
<text x="20" y="104" font-size="10.5" fill="#5b6472">step</text>
<text x="190" y="104" font-size="10.5" fill="#5b6472">what it produces</text>
<text x="560" y="104" font-size="10.5" fill="#5b6472">what it guarantees, and whether it can stop the build</text>
<line x1="16" y1="112" x2="1224" y2="112" stroke="#e3e7ed" stroke-width="1"/>
<rect x="16" y="122" width="1208" height="42" fill="#fafbfd"/>
<circle cx="34" cy="140" r="11" fill="#eef3fb" stroke="#1f3864" stroke-width="1.3"/>
<text x="34" y="144" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1f3864">1</text>
<text x="56" y="145" font-size="12" font-family="Consolas, monospace" fill="#1f2a44">make up</text>
<text x="190" y="145" font-size="11" fill="#5b6472">PostgreSQL 16 ready on localhost</text>
<text x="560" y="145" font-size="11" fill="#5b6472">Falls back to a native cluster when no Docker daemon exists.</text>
<line x1="34" y1="151" x2="34" y2="159" stroke="#c4cad3" stroke-width="1.2"/>
<circle cx="34" cy="182" r="11" fill="#991b1b" stroke="#991b1b" stroke-width="1.3"/>
<text x="34" y="186" font-size="10.5" font-weight="600" text-anchor="middle" fill="#ffffff">2</text>
<text x="56" y="187" font-size="12" font-family="Consolas, monospace" fill="#1f2a44">make ingest</text>
<text x="190" y="187" font-size="11" fill="#5b6472">schema raw + raw.load_audit</text>
<text x="560" y="187" font-size="11" fill="#991b1b">STOPS if a row count disagrees with the published reference and the gap is unexplained.</text>
<line x1="34" y1="193" x2="34" y2="201" stroke="#c4cad3" stroke-width="1.2"/>
<rect x="16" y="206" width="1208" height="42" fill="#fafbfd"/>
<circle cx="34" cy="224" r="11" fill="#eef3fb" stroke="#1f3864" stroke-width="1.3"/>
<text x="34" y="228" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1f3864">3</text>
<text x="56" y="229" font-size="12" font-family="Consolas, monospace" fill="#1f2a44">make profile</text>
<text x="190" y="229" font-size="11" fill="#5b6472">schema stg, profile.md, candidates.md</text>
<text x="560" y="229" font-size="11" fill="#5b6472">102 columns profiled; 17 candidate defects listed BEFORE any rule is written.</text>
<line x1="34" y1="235" x2="34" y2="243" stroke="#c4cad3" stroke-width="1.2"/>
<circle cx="34" cy="266" r="11" fill="#991b1b" stroke="#991b1b" stroke-width="1.3"/>
<text x="34" y="270" font-size="10.5" font-weight="600" text-anchor="middle" fill="#ffffff">4</text>
<text x="56" y="271" font-size="12" font-family="Consolas, monospace" fill="#1f2a44">make dq</text>
<text x="190" y="271" font-size="11" fill="#5b6472">dq.results, quarantine, flags, defects.csv</text>
<text x="560" y="271" font-size="11" fill="#991b1b">STOPS if any rule errors. 123 rules, 19 fired, 1 quarantined, 440 flagged.</text>
<line x1="34" y1="277" x2="34" y2="285" stroke="#c4cad3" stroke-width="1.2"/>
<rect x="16" y="290" width="1208" height="42" fill="#fafbfd"/>
<circle cx="34" cy="308" r="11" fill="#991b1b" stroke="#991b1b" stroke-width="1.3"/>
<text x="34" y="312" font-size="10.5" font-weight="600" text-anchor="middle" fill="#ffffff">5</text>
<text x="56" y="313" font-size="12" font-family="Consolas, monospace" fill="#1f2a44">make model</text>
<text x="190" y="313" font-size="11" fill="#5b6472">schema core, then rebuilds the ai views</text>
<text x="560" y="313" font-size="11" fill="#991b1b">STOPS on a duplicate key, an orphan, a false grain, or core != stg - quarantine.</text>
<line x1="34" y1="319" x2="34" y2="327" stroke="#c4cad3" stroke-width="1.2"/>
<circle cx="34" cy="350" r="11" fill="#eef3fb" stroke="#1f3864" stroke-width="1.3"/>
<text x="34" y="354" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1f3864">6</text>
<text x="56" y="355" font-size="12" font-family="Consolas, monospace" fill="#1f2a44">make reference</text>
<text x="190" y="355" font-size="11" fill="#5b6472">reference_results.json (ground truth)</text>
<text x="560" y="355" font-size="11" fill="#5b6472">10 answers worked out by hand, executed, and never shown to the model.</text>
<line x1="34" y1="361" x2="34" y2="369" stroke="#c4cad3" stroke-width="1.2"/>
<rect x="16" y="374" width="1208" height="42" fill="#fafbfd"/>
<circle cx="34" cy="392" r="11" fill="#991b1b" stroke="#991b1b" stroke-width="1.3"/>
<text x="34" y="396" font-size="10.5" font-weight="600" text-anchor="middle" fill="#ffffff">7</text>
<text x="56" y="397" font-size="12" font-family="Consolas, monospace" fill="#1f2a44">make semantic</text>
<text x="190" y="397" font-size="11" fill="#5b6472">context_pack.md</text>
<text x="560" y="397" font-size="11" fill="#991b1b">STOPS if the semantic layer describes a column that does not exist, or misses one that does.</text>
<line x1="34" y1="403" x2="34" y2="411" stroke="#c4cad3" stroke-width="1.2"/>
<circle cx="34" cy="434" r="11" fill="#eef3fb" stroke="#1f3864" stroke-width="1.3"/>
<text x="34" y="438" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1f3864">8</text>
<text x="56" y="439" font-size="12" font-family="Consolas, monospace" fill="#1f2a44">make entitlements</text>
<text x="190" y="439" font-size="11" fill="#5b6472">schema sec, 7 policies, 4 demo roles</text>
<text x="560" y="439" font-size="11" fill="#5b6472">Visible row counts are measured by logging in as each role, not asserted.</text>
<line x1="34" y1="445" x2="34" y2="453" stroke="#c4cad3" stroke-width="1.2"/>
<rect x="16" y="458" width="1208" height="42" fill="#fafbfd"/>
<circle cx="34" cy="476" r="11" fill="#eef3fb" stroke="#1f3864" stroke-width="1.3"/>
<text x="34" y="480" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1f3864">9</text>
<text x="56" y="481" font-size="12" font-family="Consolas, monospace" fill="#1f2a44">make questions</text>
<text x="190" y="481" font-size="11" fill="#5b6472">llm_logs/*.json, llm_results.json</text>
<text x="560" y="481" font-size="11" fill="#5b6472">10 model calls, sandboxed. Each logs prompt, model, parameters, raw response, cost.</text>
<line x1="34" y1="487" x2="34" y2="495" stroke="#c4cad3" stroke-width="1.2"/>
<circle cx="34" cy="518" r="11" fill="#eef3fb" stroke="#1f3864" stroke-width="1.3"/>
<text x="34" y="522" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1f3864">10</text>
<text x="56" y="523" font-size="12" font-family="Consolas, monospace" fill="#1f2a44">make evaluate</text>
<text x="190" y="523" font-size="11" fill="#5b6472">evaluation.json</text>
<text x="560" y="523" font-size="11" fill="#5b6472">Compares the model against the hand-written answers. 10 of 10 matched.</text>
<line x1="34" y1="529" x2="34" y2="537" stroke="#c4cad3" stroke-width="1.2"/>
<rect x="16" y="542" width="1208" height="42" fill="#fafbfd"/>
<circle cx="34" cy="560" r="11" fill="#991b1b" stroke="#991b1b" stroke-width="1.3"/>
<text x="34" y="564" font-size="10.5" font-weight="600" text-anchor="middle" fill="#ffffff">11</text>
<text x="56" y="565" font-size="12" font-family="Consolas, monospace" fill="#1f2a44">make test</text>
<text x="190" y="565" font-size="11" fill="#5b6472">137 passing</text>
<text x="560" y="565" font-size="11" fill="#991b1b">STOPS the build on any failure, including 9 entitlement bypass attempts.</text>
<line x1="34" y1="571" x2="34" y2="579" stroke="#c4cad3" stroke-width="1.2"/>
<circle cx="34" cy="602" r="11" fill="#991b1b" stroke="#991b1b" stroke-width="1.3"/>
<text x="34" y="606" font-size="10.5" font-weight="600" text-anchor="middle" fill="#ffffff">12</text>
<text x="56" y="607" font-size="12" font-family="Consolas, monospace" fill="#1f2a44">make deliverables</text>
<text x="190" y="607" font-size="11" fill="#5b6472">workbook, decision record, ZIP</text>
<text x="560" y="607" font-size="11" fill="#991b1b">STOPS if the decision record runs past 2 pages. Every figure is read, never typed.</text>
<line x1="34" y1="613" x2="34" y2="621" stroke="#c4cad3" stroke-width="1.2"/>
<rect x="16" y="626" width="1208" height="42" fill="#fafbfd"/>
<circle cx="34" cy="644" r="11" fill="#eef3fb" stroke="#1f3864" stroke-width="1.3"/>
<text x="34" y="648" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1f3864">13</text>
<text x="56" y="649" font-size="12" font-family="Consolas, monospace" fill="#1f2a44">make status</text>
<text x="190" y="649" font-size="11" fill="#5b6472">STATUS_REPORT.md</text>
<text x="560" y="649" font-size="11" fill="#5b6472">Reports what ran and what did not. A step that never ran is marked NOT EXECUTED.</text>
<line x1="16" y1="678" x2="1224" y2="678" stroke="#e3e7ed" stroke-width="1"/>
<text x="20" y="704" font-size="11.5" fill="#1f2a44">Two steps are deliberately NOT in this chain: <tspan font-family="Consolas, monospace" font-size="11">make diagrams</tspan> (documentation) and <tspan font-family="Consolas, monospace" font-size="11">make simulate</tspan> (the next-step agent harness).</text>
<text x="20" y="722" font-size="11.5" fill="#5b6472">Neither is part of the data product, and nothing in the pipeline depends on them, so neither can break a build or slow it down.</text>
<text x="20" y="744" font-size="11.5" fill="#15803d">Re-running is safe at every step: the whole thing rebuilds from the eight source files, so there is no state to repair -- only a command to re-run.</text>
</g>
</svg>