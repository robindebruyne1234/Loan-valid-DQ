<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 966" width="1400" height="966" role="img" aria-label="The complete system built in this proof of concept. Seven database schemas form the spine; for each one the diagram names the code that builds it and who is allowed to read it. Around them: what it runs on, what it produces, and the evidence that it works.">
<rect width="1400" height="966" fill="#ffffff"/>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text x="20" y="34" font-size="18" font-weight="600" fill="#1f3864">The whole proof of concept, in one picture</text>
<text x="20" y="55" font-size="11.5" fill="#5b6472">Seven schemas are the spine. For each one: the code that builds it, and who is allowed to read it. Everything runs on one database and one language -- no cloud service, no orchestrator, no warehouse.</text>
<rect x="20" y="78" width="331" height="54" rx="5" fill="#f7f9fc" stroke="#c4cad3" stroke-width="1"/>
<text x="32" y="98" font-size="12" font-weight="600" fill="#1f2a44">PostgreSQL 16</text>
<text x="32" y="114" font-size="10" fill="#5b6472">one database, run natively; docker compose ships</text>
<text x="32" y="126" font-size="10" fill="#5b6472">as the alternative</text>
<rect x="363" y="78" width="331" height="54" rx="5" fill="#f7f9fc" stroke="#c4cad3" stroke-width="1"/>
<text x="375" y="98" font-size="12" font-weight="600" fill="#1f2a44">Python 3.13</text>
<text x="375" y="114" font-size="10" fill="#5b6472">19 modules, 7 numbered SQL files; Python</text>
<text x="375" y="126" font-size="10" fill="#5b6472">orchestrates, SQL transforms</text>
<rect x="706" y="78" width="331" height="54" rx="5" fill="#f7f9fc" stroke="#c4cad3" stroke-width="1"/>
<text x="718" y="98" font-size="12" font-weight="600" fill="#1f2a44">Claude CLI</text>
<text x="718" y="114" font-size="10" fill="#5b6472">the model under test: no tools, no filesystem,</text>
<text x="718" y="126" font-size="10" fill="#5b6472">no database</text>
<rect x="1049" y="78" width="331" height="54" rx="5" fill="#f7f9fc" stroke="#c4cad3" stroke-width="1"/>
<text x="1061" y="98" font-size="12" font-weight="600" fill="#1f2a44">LibreOffice</text>
<text x="1061" y="114" font-size="10" fill="#5b6472">used once, to turn the decision record into a</text>
<text x="1061" y="126" font-size="10" fill="#5b6472">PDF and count its pages</text>
<text x="20" y="176" font-size="10.5" fill="#5b6472">built by</text>
<text x="470" y="176" font-size="10.5" fill="#5b6472">the layer</text>
<text x="700" y="176" font-size="10.5" fill="#5b6472">read by</text>
<text x="960" y="176" font-size="10.5" fill="#5b6472">what it holds, and what is guaranteed about it</text>
<line x1="16" y1="184" x2="1384" y2="184" stroke="#e3e7ed" stroke-width="1"/>
<rect x="16" y="188" width="1368" height="74" fill="#fafbfd"/>
<text x="24" y="210" font-size="11" font-family="Consolas, monospace" fill="#1f2a44">src/ingest.py</text>
<text x="24" y="226" font-size="11" font-family="Consolas, monospace" fill="#5b6472">sql/00_schemas.sql</text>
<line x1="330" y1="214" x2="440" y2="214" stroke="#5b6472" stroke-width="1.2" marker-end="url(#am)"/>
<rect x="446" y="194" width="200" height="44" rx="5" fill="#ffffff" stroke="#8a93a0" stroke-width="1.8"/>
<text x="462" y="216" font-size="14" font-weight="600" font-family="Consolas, monospace" fill="#8a93a0">raw</text>
<text x="630" y="216" font-size="10.5" fill="#5b6472" text-anchor="end">9 objects</text>
<line x1="652" y1="214" x2="692" y2="214" stroke="#5b6472" stroke-width="1.2" marker-end="url(#am)"/>
<text x="700" y="210" font-size="10.5" fill="#1f2a44">Nothing but the next layer.</text>
<text x="960" y="210" font-size="10.5" fill="#5b6472">Verbatim text. 1,079,680 rows, every column text, SHA-256 per file.</text>
<text x="960" y="223" font-size="10.5" fill="#5b6472">Reloadable, and the only place that can say what actually arrived.</text>
<text x="24" y="284" font-size="11" font-family="Consolas, monospace" fill="#1f2a44">sql/10_stg.sql</text>
<text x="24" y="300" font-size="11" font-family="Consolas, monospace" fill="#5b6472">src/profile_data.py</text>
<line x1="330" y1="288" x2="440" y2="288" stroke="#5b6472" stroke-width="1.2" marker-end="url(#am)"/>
<rect x="446" y="268" width="200" height="44" rx="5" fill="#ffffff" stroke="#1f3864" stroke-width="1.8"/>
<text x="462" y="290" font-size="14" font-weight="600" font-family="Consolas, monospace" fill="#1f3864">stg</text>
<text x="630" y="290" font-size="10.5" fill="#5b6472" text-anchor="end">8 objects</text>
<line x1="652" y1="288" x2="692" y2="288" stroke="#5b6472" stroke-width="1.2" marker-end="url(#am)"/>
<text x="700" y="284" font-size="10.5" fill="#1f2a44">The rule engine, and the model.</text>
<text x="960" y="284" font-size="10.5" fill="#5b6472">Typed and decoded, same row count as raw. Every cast that changed a value</text>
<text x="960" y="297" font-size="10.5" fill="#5b6472">keeps the original in a *_raw column. 102 columns profiled.</text>
<rect x="16" y="336" width="1368" height="74" fill="#fafbfd"/>
<text x="24" y="358" font-size="11" font-family="Consolas, monospace" fill="#1f2a44">src/dq_runner.py</text>
<text x="24" y="374" font-size="11" font-family="Consolas, monospace" fill="#5b6472">dq/dq_rules.yaml (88 rules)</text>
<line x1="330" y1="362" x2="440" y2="362" stroke="#5b6472" stroke-width="1.2" marker-end="url(#am)"/>
<rect x="446" y="342" width="200" height="44" rx="5" fill="#ffffff" stroke="#b45309" stroke-width="1.8"/>
<text x="462" y="364" font-size="14" font-weight="600" font-family="Consolas, monospace" fill="#b45309">dq</text>
<text x="630" y="364" font-size="10.5" fill="#5b6472" text-anchor="end">7 objects</text>
<line x1="652" y1="362" x2="692" y2="362" stroke="#5b6472" stroke-width="1.2" marker-end="url(#am)"/>
<text x="700" y="358" font-size="10.5" fill="#1f2a44">The model, which subtracts it.</text>
<text x="960" y="358" font-size="10.5" fill="#5b6472">The control plane: rule results, quarantine, warn flags, reconciliation. 123</text>
<text x="960" y="371" font-size="10.5" fill="#5b6472">rules executed, 19 fired, 1 row quarantined, 440 flagged.</text>
<text x="24" y="432" font-size="11" font-family="Consolas, monospace" fill="#1f2a44">sql/30_core.sql</text>
<text x="24" y="448" font-size="11" font-family="Consolas, monospace" fill="#5b6472">src/build_model.py</text>
<line x1="330" y1="436" x2="440" y2="436" stroke="#5b6472" stroke-width="1.2" marker-end="url(#am)"/>
<rect x="446" y="416" width="200" height="44" rx="5" fill="#ffffff" stroke="#1f3864" stroke-width="1.8"/>
<text x="462" y="438" font-size="14" font-weight="600" font-family="Consolas, monospace" fill="#1f3864">core</text>
<text x="630" y="438" font-size="10.5" fill="#5b6472" text-anchor="end">13 objects</text>
<line x1="652" y1="436" x2="692" y2="436" stroke="#5b6472" stroke-width="1.2" marker-end="url(#am)"/>
<text x="700" y="432" font-size="10.5" fill="#1f2a44">The ai views, and nothing else.</text>
<text x="960" y="432" font-size="10.5" fill="#5b6472">The star schema: 4 dimensions, 1 bridge, 3 facts, 3 curated views. Verified</text>
<text x="960" y="445" font-size="10.5" fill="#5b6472">every build: keys, grains, and core = stg minus quarantine.</text>
<rect x="16" y="484" width="1368" height="74" fill="#fafbfd"/>
<text x="24" y="506" font-size="11" font-family="Consolas, monospace" fill="#1f2a44">sql/40_ai_views.sql</text>
<text x="24" y="522" font-size="11" font-family="Consolas, monospace" fill="#5b6472">semantic/semantic_layer.yaml</text>
<line x1="330" y1="510" x2="440" y2="510" stroke="#5b6472" stroke-width="1.2" marker-end="url(#am)"/>
<rect x="446" y="490" width="200" height="44" rx="5" fill="#ffffff" stroke="#15803d" stroke-width="1.8"/>
<text x="462" y="512" font-size="14" font-weight="600" font-family="Consolas, monospace" fill="#15803d">ai</text>
<text x="630" y="512" font-size="10.5" fill="#5b6472" text-anchor="end">11 objects</text>
<line x1="652" y1="510" x2="692" y2="510" stroke="#5b6472" stroke-width="1.2" marker-end="url(#am)"/>
<text x="700" y="506" font-size="10.5" fill="#1f2a44">The four consumer roles, through</text>
<text x="700" y="519" font-size="10.5" fill="#1f2a44">the guard.</text>
<text x="960" y="506" font-size="10.5" fill="#5b6472">The only surface a consumer may query. Business names, decoded labels, 11</text>
<text x="960" y="519" font-size="10.5" fill="#5b6472">entities, every view security_invoker so the policy applies.</text>
<text x="24" y="580" font-size="11" font-family="Consolas, monospace" fill="#1f2a44">sql/50_sec_rls.sql</text>
<text x="24" y="596" font-size="11" font-family="Consolas, monospace" fill="#5b6472">src/build_security.py</text>
<line x1="330" y1="584" x2="440" y2="584" stroke="#5b6472" stroke-width="1.2" marker-end="url(#am)"/>
<rect x="446" y="564" width="200" height="44" rx="5" fill="#ffffff" stroke="#991b1b" stroke-width="1.8"/>
<text x="462" y="586" font-size="14" font-weight="600" font-family="Consolas, monospace" fill="#991b1b">sec</text>
<text x="630" y="586" font-size="10.5" fill="#5b6472" text-anchor="end">7 objects</text>
<line x1="652" y1="584" x2="692" y2="584" stroke="#5b6472" stroke-width="1.2" marker-end="url(#am)"/>
<text x="700" y="580" font-size="10.5" fill="#1f2a44">The policies, on every statement.</text>
<text x="960" y="580" font-size="10.5" fill="#5b6472">Entitlements as data: users, portfolios, membership. 7 row level security</text>
<text x="960" y="593" font-size="10.5" fill="#5b6472">policies read it to decide which rows each caller sees.</text>
<rect x="16" y="632" width="1368" height="74" fill="#fafbfd"/>
<text x="24" y="654" font-size="11" font-family="Consolas, monospace" fill="#1f2a44">sql/70_inject_defects.sql</text>
<text x="24" y="670" font-size="11" font-family="Consolas, monospace" fill="#5b6472">src/inject_defects.py</text>
<line x1="330" y1="658" x2="440" y2="658" stroke="#5b6472" stroke-width="1.2" marker-end="url(#am)"/>
<rect x="446" y="638" width="200" height="44" rx="5" fill="#ffffff" stroke="#8a93a0" stroke-width="1.8"/>
<text x="462" y="660" font-size="14" font-weight="600" font-family="Consolas, monospace" fill="#8a93a0">inject</text>
<text x="630" y="660" font-size="10.5" fill="#5b6472" text-anchor="end">9 objects</text>
<line x1="652" y1="658" x2="692" y2="658" stroke="#5b6472" stroke-width="1.2" marker-end="url(#am)"/>
<text x="700" y="654" font-size="10.5" fill="#1f2a44">The test suite only. Never core.</text>
<text x="960" y="654" font-size="10.5" fill="#5b6472">A corrupted copy of stg with 20 seeded defects, one per rule family. Proves</text>
<text x="960" y="667" font-size="10.5" fill="#5b6472">the rules fire; scoped so it can never touch the product.</text>
<line x1="16" y1="724" x2="1384" y2="724" stroke="#e3e7ed" stroke-width="1"/>
<text x="20" y="748" font-size="13" font-weight="600" fill="#1f3864">Who may read the ai layer, and how much each one actually sees</text>
<text x="20" y="766" font-size="10.5" fill="#5b6472">Measured by logging in as each role and counting. "Sees everything" is a portfolio containing every client, not an exemption from the policy.</text>
<rect x="20" y="778" width="331" height="64" rx="5" fill="#ffffff" stroke="#15803d" stroke-width="1.4"/>
<text x="32" y="798" font-size="12" font-weight="600" font-family="Consolas, monospace" fill="#15803d">cro_global</text>
<text x="32" y="813" font-size="10" fill="#5b6472">group risk</text>
<text x="32" y="832" font-size="10.5" fill="#1f2a44">5,369 clients  ·  4,500 accounts  ·  682 loans</text>
<rect x="363" y="778" width="331" height="64" rx="5" fill="#ffffff" stroke="#1f3864" stroke-width="1.4"/>
<text x="375" y="798" font-size="12" font-weight="600" font-family="Consolas, monospace" fill="#1f3864">rm_north</text>
<text x="375" y="813" font-size="10" fill="#5b6472">northern book</text>
<text x="375" y="832" font-size="10.5" fill="#1f2a44">1,481 clients  ·  1,241 accounts  ·  179 loans</text>
<rect x="706" y="778" width="331" height="64" rx="5" fill="#ffffff" stroke="#1f3864" stroke-width="1.4"/>
<text x="718" y="798" font-size="12" font-weight="600" font-family="Consolas, monospace" fill="#1f3864">rm_south</text>
<text x="718" y="813" font-size="10" fill="#5b6472">southern book</text>
<text x="718" y="832" font-size="10.5" fill="#1f2a44">1,386 clients  ·  1,157 accounts  ·  194 loans</text>
<rect x="1049" y="778" width="331" height="64" rx="5" fill="#ffffff" stroke="#991b1b" stroke-width="1.4"/>
<text x="1061" y="798" font-size="12" font-weight="600" font-family="Consolas, monospace" fill="#991b1b">rm_unassigned</text>
<text x="1061" y="813" font-size="10" fill="#5b6472">no portfolio yet</text>
<text x="1061" y="832" font-size="10.5" fill="#1f2a44">0 clients  ·  0 accounts  ·  0 loans</text>
<line x1="16" y1="862" x2="1384" y2="862" stroke="#e3e7ed" stroke-width="1"/>
<text x="20" y="886" font-size="13" font-weight="600" fill="#1f3864">What one command produces, and the evidence it is right</text>
<rect x="20" y="898" width="331" height="52" rx="5" fill="#f1f8f3" stroke="#15803d" stroke-width="1.2"/>
<text x="32" y="918" font-size="12" font-weight="600" fill="#15803d">make all -- 4m28s</text>
<text x="32" y="936" font-size="10" fill="#5b6472">13 steps from empty database to every deliverable, measured</text>
<rect x="363" y="898" width="331" height="52" rx="5" fill="#f1f8f3" stroke="#15803d" stroke-width="1.2"/>
<text x="375" y="918" font-size="12" font-weight="600" fill="#15803d">137 tests</text>
<text x="375" y="936" font-size="10" fill="#5b6472">including 20 seeded defects and 9 entitlement bypass attempts</text>
<rect x="706" y="898" width="331" height="52" rx="5" fill="#f1f8f3" stroke="#15803d" stroke-width="1.2"/>
<text x="718" y="918" font-size="12" font-weight="600" fill="#15803d">10 of 10 answers</text>
<text x="718" y="936" font-size="10" fill="#5b6472">LLM matched the hand-written reference answers, first try</text>
<rect x="1049" y="898" width="331" height="52" rx="5" fill="#f1f8f3" stroke="#15803d" stroke-width="1.2"/>
<text x="1061" y="918" font-size="12" font-weight="600" fill="#15803d">4 deliverables</text>
<text x="1061" y="936" font-size="10" fill="#5b6472">workbook (9 tabs), decision record (2 pages), ZIP, defect list</text>
<defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472"/></marker></defs>
</g>
</svg>