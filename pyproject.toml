[project]
name = "berka-governed-data-product"
version = "1.0.0"
description = "Governed, entitlement-aware data product for AI over the Berka (PKDD'99) bank dataset"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "PyYAML>=6.0",
    "sqlglot>=20.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [
    ".",
    "packages/berka_control/src",
    "packages/berka_bronze/src",
    "packages/berka_silver/src",
    "packages/berka_gold/src",
]

[tool.ruff]
line-length = 100
target-version = "py311"
